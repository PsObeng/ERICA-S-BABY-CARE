# Diapers & Wipes 360 — CI/CD (PRD B18 pipeline, B16A supply-chain controls).
# Every third-party action is pinned to a full commit SHA (SEC-INT-030). Tags are in comments.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: dw360, POSTGRES_PASSWORD: dw360, POSTGRES_DB: dw360_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U dw360" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074 # 2.32.0
        with: { php-version: '8.4', extensions: 'pdo_pgsql, openssl, intl, mbstring', coverage: none }
      # No composer.lock is committed yet (the first build had no access to Packagist): resolve once, then commit the lock file.
      - run: if [ -f composer.lock ]; then composer install --no-interaction --prefer-dist --no-progress; else composer update --no-interaction --prefer-dist --no-progress; fi
      - run: composer audit
      - run: php tests/Standalone/run.php
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - name: Feature tests on PostgreSQL (exercises the append-only triggers)
        env: { DB_CONNECTION: pgsql, DB_HOST: 127.0.0.1, DB_PORT: 5432, DB_DATABASE: dw360_test, DB_USERNAME: dw360, DB_PASSWORD: dw360 }
        run: |
          cp .env.example .env && php artisan key:generate
          php artisan test --env=testing

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  codeql:
    runs-on: ubuntu-24.04
    permissions: { security-events: write, contents: read }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4 # v3.29.5
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@2a2dd30f8030072d379eb0c9ea51789aa2ea9ca4 # v3.29.5

  release:
    # Build once, hash every file, sign the manifest, attest provenance (SEC-INT-033/034).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, secrets, codeql]
    runs-on: ubuntu-24.04
    permissions: { contents: read, id-token: write, attestations: write }
    environment: production   # protected environment: the owner must approve each deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@a42e73e16d831796463b22b8d70a3efcad74e074 # 2.32.0
        with: { php-version: '8.4', extensions: 'pdo_pgsql, openssl', coverage: none }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: cd apps/api && composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - run: cd apps/web && npm ci && npm run build && cp -r dist ../api/public/app
      - name: Release manifest (SHA-256 of every deployed PHP file) + signature
        env: { RELEASE_SIGNING_KEY: '${{ secrets.RELEASE_SIGNING_KEY }}' }
        run: |
          cd apps/api
          php scripts/make-release-manifest.php "${GITHUB_SHA}" > release-manifest.json
          printf '%s' "$RELEASE_SIGNING_KEY" > /tmp/release.key
          openssl dgst -sha256 -sign /tmp/release.key -out release-manifest.json.sig release-manifest.json
          rm -f /tmp/release.key
          tar --exclude='.env' --exclude='storage/logs/*' -czf ../../dw360-${GITHUB_SHA}.tar.gz .
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with: { subject-path: 'dw360-${{ github.sha }}.tar.gz' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: release, path: 'dw360-${{ github.sha }}.tar.gz' }
      # Deploy step (host-specific): verify `gh attestation verify`, unpack to a new read-only release dir,
      # run `php artisan migrate --force` with the migrator DB role, then `php artisan integrity:verify`.
