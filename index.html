<title>Diapers &amp; Wipes 360 — ERICA'S BABY CARE</title>
<style>
:root{
  --bb:#0B1A2E;--bb2:#16294A;--bb3:#22385F;--gold:#D4AF37;--gold-t:#8A6D1A;--white:#FFFFFF;
  --surface:#F5F6F8;--line:#DDE1E7;--text:#1A2233;--muted:#5B6575;
  --ok:#15803D;--ok-bg:#E5F4E4;--warn:#B45309;--warn-bg:#FDF1E3;--bad:#B91C1C;--bad-bg:#FBEBEB;
  --r:10px;--sh:0 1px 2px rgba(11,26,46,.08),0 2px 8px rgba(11,26,46,.06);
  font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bb)}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--bb);color:var(--white);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
/* Frozen: the logo block and the sign-in box stay put; only the module list scrolls (with room for the curved tab corners) */
.side .ghstripe,.side .brand,.side .me{flex-shrink:0}
.side .nav{overflow-y:auto;overflow-x:hidden;min-height:0;padding-top:24px;padding-bottom:24px;scroll-padding:24px 0;overscroll-behavior:contain;scrollbar-width:none}
/* No visible scrollbar in the sidebar (it cut across the selected pill where it joins the page). The list still scrolls with the wheel, touch or keyboard;
   a soft shadow with a gold arrow shows when more modules are above or below. */
.side .nav::-webkit-scrollbar{display:none;width:0;height:0}
.side .brand,.side .me{position:relative;z-index:2;transition:box-shadow .2s}
.side.more-up .brand{box-shadow:0 12px 14px -8px rgba(0,0,0,.7)}
.side.more-down .me{box-shadow:0 -12px 14px -8px rgba(0,0,0,.7)}
.side .me::before,.side .brand::after{position:absolute;left:50%;transform:translateX(-50%);color:var(--gold);font-size:13px;line-height:1;pointer-events:none;opacity:0;transition:opacity .2s}
.side .me::before{content:"▾";top:-17px}.side .brand::after{content:"▴";bottom:-17px}
.side.more-down .me::before,.side.more-up .brand::after{opacity:.9}

.disp{font-family:"Lilita One","Arial Rounded MT Bold","Arial Black",Impact,sans-serif;font-weight:400;letter-spacing:.02em}
.ghstripe{height:5px;background:linear-gradient(90deg,#CE1126 0 33.3%,#FCD116 33.3% 66.6%,#006B3F 66.6%)}
.brand{padding:16px 14px 14px;border-bottom:1px solid var(--bb3);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.brand .logo{width:84px;height:84px;border-radius:20px;background:radial-gradient(circle at 50% 35%,var(--bb3),var(--bb) 72%);display:grid;place-items:center;box-shadow:0 0 0 1px #2C4772,0 6px 16px rgba(0,0,0,.45)}
.brand .logo img{width:74px;height:74px;object-fit:contain;border-radius:12px}
/* Uploaded logos sit on a white glossy tile so dark or see-through logos stay visible; owners can pick the dark tile for light logos */
.brand .logo.up,.brandset .lprev.up{background:radial-gradient(circle at 50% 30%,#FFFFFF,#E9EDF3 75%,#D3DAE4);box-shadow:0 0 0 3px var(--gold),0 6px 16px rgba(0,0,0,.45)}
.brand .logo.up.dk,.brandset .lprev.up.dk{background:radial-gradient(circle at 50% 35%,var(--bb3),var(--bb) 72%);box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.45)}

.rcpt{width:300px;margin:0 auto;font-family:"Courier New",monospace;font-size:12px;color:#000;background:#fff;padding:10px;border:1px dashed #999}
.rcpt h4{text-align:center;margin:0;font-size:15px}
.rcpt .c{text-align:center}
.rcpt table{font-size:12px}
.rcpt td{border:0;padding:2px 0;background:#fff!important}
.rcpt hr{border:0;border-top:1px dashed #000}
#print-area{display:none}
.bottomnav{display:none}
@media print{
  /* Only the printout is printed: the app screen is removed from the page (not just hidden), so no blank pages follow and the paper stays white */
  html,body{background:#fff!important;height:auto!important;min-height:0!important;overflow:visible!important;margin:0!important}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;position:static;width:auto}
  #print-area .rcpt{border:0}
  #print-area .prt{padding:0}#print-area .prt th,#print-area .prt td{border:1px solid #bbb;padding:5px 6px;font-size:12px}#print-area .prt h2{margin:0 0 2px}#print-area .prt .meta{color:#444;margin:0 0 10px;font-size:12px}
  #print-area *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:4mm}
}
@media (max-width:980px){.pos{grid-template-columns:1fr}.cart{position:static}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--bb);z-index:20;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
  .bottomnav button{flex:0 0 auto;background:none;border:0;color:#E8ECF3;padding:8px 12px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:68px}
  .bottomnav button{border-radius:999px;margin:5px 2px}
  .bottomnav{padding-left:6px;padding-right:6px}
  .bottomnav button.on{color:var(--bb);font-weight:700;background:linear-gradient(180deg,#FFFFFF 0%,#F2F4F8 40%,#DCE2EA 72%,#BCC6D3 100%);box-shadow:inset 0 2px 1px rgba(255,255,255,.95),inset 0 -5px 8px rgba(11,26,46,.14),0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.4)}
  .content{padding:12px 12px 90px}
  .g2,.g3{grid-template-columns:1fr}
  .top{margin:8px 10px 6px;padding:8px 16px}
}
/* Short screens: a tighter sidebar so every module fits without scrolling where possible */
@media (max-height:820px){.brand{padding:10px 14px;gap:4px}.brand .logo{width:60px;height:60px;border-radius:14px}.brand .logo svg{width:46px;height:50px}.brand .logo img{width:52px;height:52px}

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="print-area"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="ctip" class="ctip" aria-hidden="true"></div>
<script>
'use strict';
/* =========================================================================
   Diapers & Wipes 360 — Release 1 working app (single-file, offline-capable)
   Data stays on this device (browser storage). The production system moves
   this data to the Laravel API + PostgreSQL (see codebase).
   Money is stored in integer pesewas. Quantities in packs (base unit).
   ========================================================================= */

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
const GHS = p => (p < 0 ? '−' : '') + 'GH₵' + (Math.abs(p || 0) / 100).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const toP = v => { const n = parseFloat(String(v ?? '').replace(/[, ]/g, '')); return isFinite(n) ? Math.round(n * 100) : 0; };
const p2s = p => ((p || 0) / 100).toFixed(2);
const today = () => new Date().toISOString().slice(0, 10); // Africa/Accra = UTC
const DAY = 864e5;
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / DAY);
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB', {day: 'numeric', month: 'short', year: 'numeric'});
const fmtDT = ts => new Date(ts).toLocaleString('en-GB', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'});
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);

async function sha(s) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { // fallback (non-secure context): FNV-1a 64-ish
    let h1 = 0x811c9dc5, h2 = 0x01000193;
    for (let i = 0; i < s.length; i++) { h1 = Math.imul(h1 ^ s.charCodeAt(i), 16777619); h2 = Math.imul(h2 + s.charCodeAt(i), 2246822507); }
    return 'f' + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
  }
}

// Ghana phone handling (CRM-002)
const NET = {MTN: ['24', '54', '55', '59', '25', '53'], Telecel: ['20', '50'], AT: ['26', '56', '27', '57']};
function normPhone(s) {
  let d = String(s || '').replace(/\D/g, '');
  if (d.startsWith('233') && d.length === 12) d = d.slice(3);
  else if (d.startsWith('0') && d.length === 10) d = d.slice(1);
  if (d.length !== 9) return null;
  return '+233' + d;
}
const dispPhone = e => { if (!e) return ''; const l = '0' + e.slice(4); return l.slice(0, 3) + ' ' + l.slice(3, 6) + ' ' + l.slice(6); };
function network(e) { if (!e) return ''; const p = e.slice(4, 6); for (const [k, v] of Object.entries(NET)) if (v.includes(p)) return k; return 'Other'; }
const waLink = (e, text) => 'https://wa.me/' + String(e || '').replace('+', '') + '?text=' + encodeURIComponent(text);

// ---------- storage ----------
const KEY = 'dw360_r1_v1';
let db = null, mem = null, cur = null;
// Can this view keep data? A chat preview panel, for example, cannot: everything there is lost when it closes.
const STORE_OK = (() => { try { const k = '__dw360_probe'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })();
const NOSAVE = `<div class="nosave" role="alert"><b>This view cannot save anything.</b> Your logo, sales, customers and settings are lost as soon as it is closed or reloaded (a chat preview panel works this way). To keep them, open the app from its link, or open the downloaded HTML file in Chrome or Edge.</div>`;
function load() { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : mem; } catch (e) { return mem; } }
function save() { mem = db; try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* storage unavailable: kept in memory */ } }

// ---------- audit log (hash-chained, SEC-INT-060) ----------
let auditQ = Promise.resolve();
function audit(action, detail) {
  const e = {ts: Date.now(), staff: cur ? cur.id : 'system', action, detail: String(detail || '')};
  auditQ = auditQ.then(async () => {
    const prev = db.audit.length ? db.audit[db.audit.length - 1].hash : 'GENESIS';
    e.seq = db.audit.length + 1; e.prev = prev;
    e.hash = await sha(prev + JSON.stringify([e.seq, e.ts, e.staff, e.action, e.detail]));
    db.audit.push(e); save();
  });
  return auditQ;
}
async function verifyAudit() {
  await auditQ; let prev = 'GENESIS';
  for (const e of db.audit) {
    const h = await sha(prev + JSON.stringify([e.seq, e.ts, e.staff, e.action, e.detail]));
    if (e.prev !== prev || h !== e.hash) return {ok: false, at: e.seq};
    prev = e.hash;
  }
  return {ok: true, count: db.audit.length};
}

// ---------- roles & permissions (B3) ----------
const ROLES = {owner: 'Owner', manager: 'Manager', cashier: 'Cashier'};
const PERMS = {
  owner: ['*'],
  manager: ['sell', 'sales_view', 'verify_momo', 'refund', 'prices', 'receive', 'adjust', 'customers', 'receivables', 'flyers', 'reports', 'shifts_all'],
  cashier: ['sell', 'sales_view', 'customers', 'receive']
};
const can = p => !!cur && (PERMS[cur.role].includes('*') || PERMS[cur.role].includes(p));
const isOwner = () => cur && cur.role === 'owner';

// ---------- lookups ----------
const P = id => db.products.find(x => x.id === id);
const C = id => db.customers.find(x => x.id === id);
const S = id => db.staff.find(x => x.id === id);
const isExpired = l => !!l.exp && l.exp < today();
const nearExp = l => !!l.exp && !isExpired(l) && daysBetween(today(), l.exp) <= db.settings.nearExpiryDays;
const lotsOf = pid => db.lots.filter(l => l.pid === pid && l.qty > 0).sort((a, b) => (a.exp || '9999') < (b.exp || '9999') ? -1 : 1);
const onHand = pid => sum(db.lots.filter(l => l.pid === pid), l => l.qty);
const avail = pid => sum(db.lots.filter(l => l.pid === pid && !isExpired(l)), l => l.qty);
function consentOf(cid, ch) { const r = db.consents.filter(x => x.cid === cid && x.ch === ch).sort((a, b) => b.ts - a.ts)[0]; return r ? r.status : 'unknown'; }
const canMarket = (c, ch) => !c.dnm && consentOf(c.id, ch) === 'opted_in';
const balance = cid => sum(db.invoices.filter(i => i.cid === cid), i => i.amount - i.paid - (i.written || 0));
function overdueDays(cid) {
  let m = 0;
  for (const i of db.invoices.filter(i => i.cid === cid && i.amount - i.paid - (i.written || 0) > 0)) { const d = daysBetween(i.due, today()); if (d > m) m = d; }
  return m;
}
const openShift = sid => db.shifts.find(s => s.staff === sid && !s.closeTs);
function nextNo(type) { db.counters[type] = (db.counters[type] || 0) + 1; return type + '-' + new Date().getFullYear() + '-' + String(db.counters[type]).padStart(6, '0'); }
const cartonLabel = p => p.cartonPacks > 1 ? `1 carton = ${p.cartonPacks} packs` : 'no carton unit';

// pricing (PRC/WHL-002): tier chosen from customer type and quantity
function linePrice(line, cust) {
  const p = P(line.pid);
  if (line.unit === 'carton') {
    const up = p.cartonPrice || p.retail * p.cartonPacks;
    return {unitPrice: up, tier: p.cartonPrice ? 'Carton' : 'Retail ×' + p.cartonPacks, packs: line.qty * p.cartonPacks};
  }
  const ws = cust && cust.type === 'wholesale';
  const a = p.tierA && (line.qty >= p.tierAMin || ws);
  return {unitPrice: a ? p.tierA : p.retail, tier: a ? 'Tier A' : 'Retail', packs: line.qty};
}

// ---------- seed (sample data — clearly marked) ----------
async function seed() {
  const pin = async (salt, p) => sha(salt + ':' + p);
  const d = {
    v: 1, created: Date.now(),
    settings: {
      name: "ERICA'S BABY CARE", location: 'Hansua–Techiman', phone1: '0544935335', phone2: '0241087822', momoNumber: '0544935335',
      tagline: 'Quality diapers & baby wipes — retail & wholesale', cashierDiscPct: 5, managerDiscPct: 15, momoReleaseLimit: 30000,
      nearExpiryDays: 60, adjustApproval: 20000, creditTerms: 14, overdueBlock: 7, returnDays: 7, freqWeek: 2, vatThreshold: 75000000,
      consentVersion: 'C1-2026-10', decor3d: true, reorderDays: 7,
      consentText: 'May we send you offers and new-stock alerts? About 1–2 messages a week. You can reply STOP at any time.',
      sample: true
    },
    staff: [], products: [], lots: [], movements: [], customers: [], consents: [], sales: [], invoices: [], recPayments: [],
    shifts: [], suppliers: [], receipts: [], priceHistory: [], msgs: [], audit: [], counters: {}
  };
  for (const [name, role, p] of [['Erica', 'owner', '1234'], ['Ama', 'manager', '2222'], ['Kofi', 'cashier', '3333']]) {
    const salt = uid(); d.staff.push({id: uid(), name, role, salt, pin: await pin(salt, p), active: true});
  }
  const prods = [
    ['Softcare', 'Diapers Medium (M)', 'Diapers', 'M', 40, 4, 9000, 11500, 10800, 10, 42000, false],
    ['Softcare', 'Diapers Large (L)', 'Diapers', 'L', 36, 4, 9400, 12000, 11300, 10, 44000, false],
    ['Molfix', 'Diapers Size 3 (M)', 'Diapers', 'M', 58, 3, 13500, 16500, 15800, 10, 46500, false],
    ['Molfix', 'Pants Size 5 (XL)', 'Pants', 'XL', 44, 3, 14800, 18000, 17200, 10, 51000, false],
    ['Pampers', 'Baby-Dry Size 4 (L)', 'Diapers', 'L', 46, 3, 19500, 23500, 22500, 6, 66000, false],
    ['Huggies', 'Dry Comfort Newborn (NB)', 'Diapers', 'NB', 30, 4, 8800, 11000, 10400, 10, 40000, false],
    ['Softcare', 'Baby Wipes 80', 'Wipes', '—', 80, 12, 1500, 2200, 2000, 12, 22800, true],
    ['Molfix', 'Baby Wipes 60', 'Wipes', '—', 60, 12, 1300, 1900, 1750, 12, 19800, true],
    ['Huggies', 'Pure Wipes 56', 'Wipes', '—', 56, 10, 1900, 2700, 2500, 10, 25000, true],
  ];
  let n = 1;
  for (const [brand, name, cat, size, packCount, cartonPacks, cost, retail, tierA, tierAMin, cartonPrice, expT] of prods) {
    const id = uid();
    d.products.push({id, sku: 'SKU-' + String(n++).padStart(3, '0'), brand, name, cat, size, packCount, cartonPacks, cost, retail, tierA, tierAMin, cartonPrice, low: expT ? 24 : 12, expT, active: true});
    const add = (qty, exp, batch) => { const lid = uid(); d.lots.push({id: lid, pid: id, qty, exp: exp || null, batch: batch || (expT ? 'B' + Math.floor(Math.random() * 9000 + 1000) : '-'), recv: Date.now() - 20 * DAY});
      d.movements.push({id: uid(), ts: Date.now() - 20 * DAY, pid: id, lot: lid, type: 'opening', qty, reason: 'Opening stock (sample)', ref: 'OPEN', staff: d.staff[0].id}); };
    if (expT) {
      const t = Date.now();
      if (name.includes('80')) { add(40, new Date(t + 30 * DAY).toISOString().slice(0, 10), 'SC80-A'); add(96, new Date(t + 300 * DAY).toISOString().slice(0, 10), 'SC80-B'); }
      else if (name.includes('60')) { add(6, new Date(t - 5 * DAY).toISOString().slice(0, 10), 'MF60-X'); add(72, new Date(t + 240 * DAY).toISOString().slice(0, 10), 'MF60-Y'); }
      else add(14, new Date(t + 180 * DAY).toISOString().slice(0, 10), 'HG56-1');
    } else add(name.includes('Newborn') ? 8 : 30 + Math.floor(Math.random() * 30));
  }
  const cust = [
    ['Akosua Mensah', '0244123456', 'retail', 'Hansua', 0, ['opted_in', 'opted_in']],
    ['Yaw Boateng', '0201987654', 'retail', 'Techiman Central', 0, ['opted_in', 'unknown']],
    ['Abena Owusu', '0557334455', 'retail', 'Tuobodom Road', 0, ['withdrawn', 'unknown']],
    ['Nkoranza Baby Shop (Mrs Asante)', '0245556677', 'wholesale', 'Nkoranza', 300000, ['opted_in', 'opted_in']],
    ['Tanoso Mini Mart (Kwame)', '0268889900', 'wholesale', 'Tanoso', 200000, ['unknown', 'opted_in']],
  ];
  for (const [name, ph, type, town, limit, cons] of cust) {
    const id = uid(); const e = normPhone(ph);
    d.customers.push({id, name, phone: e, type, town, gps: '', limit, terms: 14, notes: '', dnm: false, created: Date.now() - 15 * DAY, source: 'walk-in'});
    ['whatsapp', 'sms'].forEach((ch, i) => { if (cons[i] !== 'unknown') d.consents.push({id: uid(), cid: id, ch, status: cons[i], version: 'C1-2026-10', source: 'counter (sample)', staff: d.staff[0].id, ts: Date.now() - 15 * DAY}); });
  }
  d.suppliers = [{id: uid(), name: 'Kumasi Baby Products Ltd (sample)', phone: '+233322000000'}, {id: uid(), name: 'Accra Hygiene Distributors (sample)', phone: '+233302000000'}];
  db = d;
  // sample sales over the last 7 days (closed shifts)
  const ws = d.customers.filter(c => c.type === 'wholesale');
  for (let k = 6; k >= 1; k--) {
    const ts0 = Date.now() - k * DAY; const sh = {id: uid(), staff: d.staff[2].id, openTs: ts0 - 3600e3, float: 20000, moves: []};
    d.shifts.push(sh);
    const nSales = 3 + (k % 3);
    for (let j = 0; j < nSales; j++) {
      const p1 = d.products[(k + j) % d.products.length], p2 = d.products[(k * 2 + j) % d.products.length];
      const lines = [{pid: p1.id, unit: 'pack', qty: 1 + (j % 2)}, {pid: p2.id, unit: 'pack', qty: 1}];
      const isWs = j === 0 && k % 2 === 0; const c = isWs ? ws[k % ws.length] : null;
      if (isWs) lines.push({pid: p1.id, unit: 'carton', qty: 1});
      const priced = lines.map(l => ({...l, ...linePrice(l, c)}));
      const total = sum(priced, l => l.unitPrice * l.qty);
      if (priced.some(l => avail(l.pid) < l.packs * 2)) continue;
      const tender = isWs ? {cash: 0, momo: null, credit: total} : (j % 2 ? {cash: total, momo: null, credit: 0} : {cash: 0, momo: {amt: total, net: 'MTN', txn: 'SAMPLE' + k + j + Math.floor(Math.random() * 1e6), payer: '+233240000000', status: 'verified', by: d.staff[0].id}, credit: 0});
      commitSale({lines: priced, cid: c ? c.id : null, subtotal: total, discount: 0, total, tender, staff: d.staff[2].id, shiftId: sh.id, ts: ts0 + j * 1800e3}, true);
    }
    const exp = expectedCash(sh); sh.closeTs = ts0 + 9 * 3600e3; sh.counted = exp; sh.expected = exp; sh.variance = 0; sh.reason = '';
  }
  d.settings.sampleBaseline = true;
  return d;
}

// ---------- sale engine (POS-001/002, INV-003/011, PAY-001/002, WHL-004) ----------
function commitSale(o, silent) {
  const used = {}; // lot -> qty used in this sale
  const lines = o.lines.map(l => {
    const p = P(l.pid); let need = l.packs; const lots = [];
    for (const lot of lotsOf(l.pid)) {
      if (isExpired(lot)) continue;
      const free = lot.qty - (used[lot.id] || 0); const t = Math.min(free, need);
      if (t > 0) { lots.push({lot: lot.id, qty: t}); used[lot.id] = (used[lot.id] || 0) + t; need -= t; }
      if (!need) break;
    }
    if (need) throw new Error('Not enough sellable stock for ' + p.brand + ' ' + p.name);
    return {pid: l.pid, name: p.brand + ' ' + p.name, unit: l.unit, qty: l.qty, packs: l.packs, unitPrice: l.unitPrice, tier: l.tier, cost: p.cost * l.packs, lots, returned: 0};
  });
  const ts = o.ts || Date.now(); const id = uid(); const no = nextNo('RCPT');
  for (const l of lines) for (const a of l.lots) {
    const lot = db.lots.find(x => x.id === a.lot); lot.qty -= a.qty;
    db.movements.push({id: uid(), ts, pid: l.pid, lot: a.lot, type: 'sale', qty: -a.qty, reason: 'Sale', ref: no, staff: o.staff});
  }
  const pays = [];
  const t = o.tender;
  if (t.cash > 0) pays.push({id: uid(), method: 'cash', amount: t.cash, status: 'received'});
  if (t.momo && t.momo.amt > 0) pays.push({id: uid(), method: 'momo', amount: t.momo.amt, net: t.momo.net, txn: t.momo.txn, payer: t.momo.payer, status: t.momo.status, by: t.momo.by || null, vts: t.momo.status === 'verified' ? ts : null});
  if (t.credit > 0) pays.push({id: uid(), method: 'credit', amount: t.credit, status: 'on account'});
  const sale = {id, no, ts, staff: o.staff, cid: o.cid, shiftId: o.shiftId, lines, subtotal: o.subtotal, discount: o.discount, total: o.total, pays, change: o.change || 0, returns: [], reprints: 0};
  db.sales.push(sale);
  if (t.credit > 0) {
    const c = C(o.cid);
    db.invoices.push({id: uid(), cid: o.cid, saleId: id, no, ts, due: new Date(ts + (c.terms || db.settings.creditTerms) * DAY).toISOString().slice(0, 10), amount: t.credit, paid: 0, written: 0});
  }
  if (!silent) { audit('sale', `${no} total ${GHS(o.total)}${t.credit ? ' credit ' + GHS(t.credit) : ''}${t.momo && t.momo.amt ? ' momo ' + t.momo.txn : ''}`); save();
    const cu = o.cid ? C(o.cid) : null; emit('sale.completed', {receipt: no, total: cedi(o.total), subtotal: cedi(o.subtotal), discount: cedi(o.discount), payments: pays.map(x => ({method: x.method, amount: cedi(x.amount), status: x.status, network: x.net || undefined})), lines: lines.map(l => ({product: l.name, unit: l.unit, qty: l.qty, unitPrice: cedi(l.unitPrice)})), staff: (S(o.staff) || {}).name, customer: cu ? {name: cu.name, phone: dispPhone(cu.phone), type: cu.type} : null}); }
  return sale;
}
function expectedCash(sh) {
  const sales = db.sales.filter(s => s.shiftId === sh.id);
  const cashIn = sum(sales, s => sum(s.pays.filter(p => p.method === 'cash'), p => p.amount));
  const refunds = sum(db.sales, s => sum(s.returns.filter(r => r.shiftId === sh.id && r.method === 'cash'), r => r.amount));
  const debtCash = sum(db.recPayments.filter(r => r.shiftId === sh.id && r.method === 'cash'), r => r.amount);
  const moves = sum(sh.moves || [], m => m.type === 'in' ? m.amt : -m.amt);
  return sh.float + cashIn - refunds + debtCash + moves;
}

// ---------- UI state ----------
const ui = {route: 'dashboard', cart: {lines: [], cid: null, disc: {type: 'pct', v: 0}}, q: '', cat: 'All', tab: {}, flyer: {tpl: 'single', pids: [], headline: 'This week\'s offer', promo: '', until: ''}};
let loginSel = null, pinBuf = '';

  const range = ui.tab.dr || 7; const figs = [...document.querySelectorAll('figure[data-chart]')];

  const first = figs.filter(inView), later = figs.filter(f => !inView(f));
  const step = () => { const f = first.shift(); if (!f) return; drawChart(f, range); requestAnimationFrame(step); };
  requestAnimationFrame(step);
  if ('IntersectionObserver' in window) {

    later.forEach(f => chartObserver.observe(f));

};

function tenderRead() {
  const k = cartPriced();
  const cash = toP($('#t-cash')?.value), momo = toP($('#t-momo')?.value), credit = toP($('#t-credit')?.value);
  const nonCash = momo + credit; const paid = cash + nonCash;
  const change = Math.max(0, Math.min(cash, paid - k.total));
  return {k, cash, momo, credit, paid, change, due: Math.max(0, k.total - paid)};
}
function tenderUpdate() {
  const t = tenderRead();
  $('#t-paid').textContent = GHS(t.paid); $('#t-change').textContent = GHS(t.change); $('#t-due').textContent = GHS(t.due);
  $('#momo-x').style.display = t.momo > 0 ? 'block' : 'none';
}
async function completeSale() {
  const t = tenderRead(); const k = t.k; const err = m => { $('#t-err').textContent = m; };
  if (!k.lines.length) return err('The cart is empty.');
  if (t.due > 0) return err('Payment is short by ' + GHS(t.due) + '.');
  if (t.momo + t.credit > k.total) return err('MoMo and credit together cannot exceed the total; only cash can give change.');
  const sh = openShift(cur.id); if (!sh) return err('Open a cash shift first.');
  // stock check
  const need = {}; k.lines.forEach(l => need[l.pid] = (need[l.pid] || 0) + l.packs);
  for (const [pid, q] of Object.entries(need)) if (avail(pid) < q) { const p = P(pid); return err(`Only ${avail(pid)} sellable packs of ${p.brand} ${p.name} (expired batches are blocked).`); }
  // discount limit (PRC-007)
  if (k.discount > 0) {
    const pct = k.discount / k.subtotal * 100;
    const lim = cur.role === 'owner' ? 100 : cur.role === 'manager' ? db.settings.managerDiscPct : db.settings.cashierDiscPct;
    if (pct > lim + 1e-9) { const ap = await requirePin(pct > db.settings.managerDiscPct ? ['owner'] : ['owner', 'manager'], `Discount of ${pct.toFixed(1)}% is above your ${lim}% limit.`); if (!ap) return err('Discount not approved.'); }
  }
  // credit (WHL-004)
  if (t.credit > 0) {
    const c = k.c; if (!c || c.type !== 'wholesale') return err('Credit is only for wholesale accounts.');
    const over = balance(c.id) + t.credit > c.limit, late = overdueDays(c.id) > db.settings.overdueBlock;
    if ((over || late) && !isOwner()) { const ap = await requirePin(['owner'], `${c.name}: ${over ? 'credit limit exceeded' : ''}${over && late ? ' and ' : ''}${late ? overdueDays(c.id) + ' days overdue' : ''}. Owner approval needed.`); if (!ap) return err('Credit not approved.'); }
  }
  // MoMo (PAY-001/002)
  let momo = null;
  if (t.momo > 0) {
    const net = $('#t-net').value, txn = $('#t-txn').value.trim().toUpperCase(), payer = normPhone($('#t-payer').value);
    if (txn.length < 6) return err('Enter the MoMo transaction ID (at least 6 characters).');
    if (db.sales.some(s => s.pays.some(p => p.method === 'momo' && p.net === net && p.txn === txn)) || db.recPayments.some(r => r.net === net && r.txn === txn)) return err('This MoMo transaction ID has already been used. It cannot be accepted twice.');
    if (!payer) return err('Enter a valid Ghana payer number.');
    momo = {amt: t.momo, net, txn, payer, status: 'pending'};
    const known = k.c && (Date.now() - k.c.created > 30 * DAY || db.sales.some(s => s.cid === k.c.id));
    if (can('verify_momo')) { momo.status = 'verified'; momo.by = cur.id; }
    else if (t.momo > db.settings.momoReleaseLimit && !known) {
      const ap = await requirePin(['owner', 'manager'], `MoMo ${GHS(t.momo)} is above the ${GHS(db.settings.momoReleaseLimit)} release limit. A manager must check the MoMo statement for ${net} ${txn} now.`);
      if (!ap) return err('MoMo must be verified before the goods leave.'); momo.status = 'verified'; momo.by = ap.id;
    }
  }
  try {
    const sale = commitSale({lines: k.lines, cid: k.c ? k.c.id : null, subtotal: k.subtotal, discount: k.discount, total: k.total, tender: {cash: t.cash - t.change, momo, credit: t.credit}, change: t.change, staff: cur.id, shiftId: sh.id});
    ui.cart = {lines: [], cid: null, disc: {type: 'pct', v: 0}};
    closeModal(); render(); showReceipt(sale.id);
  } catch (e) { err(e.message); }
}

async function doReturn(id) {
  const s = db.sales.find(x => x.id === id); const err = m => $('#r-err').textContent = m;
  const qty = [...document.querySelectorAll('[data-rl]')].map(e => Math.max(0, parseInt(e.value) || 0));
  if (!qty.some(q => q > 0)) return err('Enter at least one quantity to return.');
  for (let i = 0; i < qty.length; i++) if (qty[i] > s.lines[i].qty - s.lines[i].returned) return err('You cannot return more than was sold.');
  const why = $('#r-why').value.trim(); if (!why) return err('Enter a reason.');
  const sh = openShift(cur.id); const method = $('#r-m').value, cond = $('#r-c').value;
  if (method === 'cash' && !sh) return err('Open a cash shift to refund cash.');
  const share = s.subtotal ? (s.subtotal - s.discount) / s.subtotal : 1;
  const amount = Math.round(sum(qty.map((q, i) => q * s.lines[i].unitPrice)) * share);
  if (!can('refund') || daysBetween(new Date(s.ts).toISOString().slice(0, 10), today()) > db.settings.returnDays) {
    const ap = await requirePin(['owner', 'manager'], `Return of ${GHS(amount)} on ${s.no}${daysBetween(new Date(s.ts).toISOString().slice(0, 10), today()) > db.settings.returnDays ? ' is outside the return window' : ''}.`);
    if (!ap) return err('Return not approved.');
  }
  const rno = nextNo('RTN');
  qty.forEach((q, i) => {
    if (!q) return; const l = s.lines[i]; l.returned += q; let packs = l.unit === 'carton' ? q * P(l.pid).cartonPacks : q;
    for (const a of l.lots) { if (!packs) break; const lot = db.lots.find(x => x.id === a.lot); const t = Math.min(a.qty, packs); packs -= t;
      if (cond === 'stock' && !isExpired(lot)) { lot.qty += t; db.movements.push({id: uid(), ts: Date.now(), pid: l.pid, lot: lot.id, type: 'return', qty: t, reason: 'Customer return: ' + why, ref: rno, staff: cur.id}); }

  });
  if (method === 'account') { let left = amount; for (const inv of db.invoices.filter(x => x.cid === s.cid && x.amount - x.paid - x.written > 0)) { const t = Math.min(left, inv.amount - inv.paid - inv.written); inv.written += t; left -= t; if (!left) break; } }
  s.returns.push({no: rno, ts: Date.now(), amount, method, shiftId: sh ? sh.id : null, staff: cur.id, reason: why, cond});
  audit('return', `${rno} on ${s.no} ${GHS(amount)} ${method}`); save(); emit('sale.returned', {return: rno, receipt: s.no, amount: cedi(amount), method, reason: why, restocked: cond === 'stock'}); closeModal(); render(); toast('Return recorded: ' + GHS(amount));
}

function saveGRN() {
  const err = m => $('#g-err').textContent = m;
  const sup = $('#g-sup').value.trim(); if (!sup) return err('Enter the supplier.');
  const lines = [];
  for (const d of document.querySelectorAll('[data-gl]')) {
    const g = k => d.querySelector(`[data-g=${k}]`).value; const p = P(g('pid'));
    const qty = parseInt(g('qty')) || 0, cost = toP(g('cost')), bad = parseInt(g('bad')) || 0; if (!qty) continue;
    const packs = (g('unit') === 'carton' ? qty * p.cartonPacks : qty);
    if (bad > packs) return err('Damaged/short cannot be more than received for ' + p.name);
    if (!cost) return err('Enter the cost for ' + p.name);
    if (p.expT && !g('exp')) return err('Expiry date is required for ' + p.name);
    if (g('exp') && g('exp') < today()) return err(p.name + ': that batch is already expired — do not accept it into sellable stock.');
    lines.push({p, packs, accepted: packs - bad, bad, lineCost: cost * qty, batch: g('batch').trim(), exp: g('exp') || null});
  }
  if (!lines.length) return err('Add at least one line with a quantity.');
  const land = toP($('#g-land').value); const tot = sum(lines, l => l.lineCost);
  const no = nextNo('GRN'); const warn = [];
  for (const l of lines) {
    const share = tot ? Math.round(land * l.lineCost / tot) : 0; const perPack = Math.round((l.lineCost + share) / Math.max(1, l.accepted));
    const oh = avail(l.p.id); const old = l.p.cost;
    l.p.cost = Math.round((oh * old + l.accepted * perPack) / Math.max(1, oh + l.accepted)); // weighted average (INV-022)
    if (l.p.retail < l.p.cost) warn.push(l.p.name);
    const lid = uid(); db.lots.push({id: lid, pid: l.p.id, qty: l.accepted, exp: l.exp, batch: l.batch || '-', recv: Date.now()});
    db.movements.push({id: uid(), ts: Date.now(), pid: l.p.id, lot: lid, type: 'receive', qty: l.accepted, reason: `From ${sup}${l.bad ? `; ${l.bad} damaged/short not accepted` : ''}`, ref: no, staff: cur.id});
    l.perPack = perPack;
  }
  if (!db.suppliers.some(s => s.name === sup)) db.suppliers.push({id: uid(), name: sup, phone: ''});
  db.receipts.push({id: uid(), no, ts: Date.now(), supplier: sup, inv: $('#g-inv').value.trim(), lines: lines.map(l => ({pid: l.p.id, packs: l.packs, accepted: l.accepted, bad: l.bad, perPack: l.perPack, batch: l.batch, exp: l.exp})), land, total: tot + land, staff: cur.id});
  audit('stock.receive', `${no} from ${sup}, ${lines.length} lines, ${GHS(tot + land)}`); save(); emit('stock.received', {grn: no, supplier: sup, total: cedi(tot + land), lines: lines.map(l => ({product: l.p.brand + ' ' + l.p.name, packs: l.accepted, rejected: l.bad, batch: l.batch || null, expiry: l.exp}))}); closeModal(); render();
  toast(warn.length ? `Saved ${no}. Warning: retail price is now below cost for ${warn.join(', ')}.` : `Saved ${no}.`, !!warn.length);
}

async function saveCount() {
  const rows = [...document.querySelectorAll('[data-cnt]')].filter(e => e.value !== '').map(e => ({p: P(e.dataset.cnt), n: parseInt(e.value) || 0}));
  if (!rows.length) return $('#k-err').textContent = 'Enter at least one count.';

  const value = sum(vars, v => Math.abs(v.d) * v.p.cost);
  if (vars.length && value > db.settings.adjustApproval && !isOwner()) { const ap = await requirePin(['owner'], `Count variances worth ${GHS(value)}: ${vars.map(v => `${v.p.name} ${v.d > 0 ? '+' : ''}${v.d}`).join(', ')}`); if (!ap) return; }
  const no = nextNo('CNT');
  for (const v of vars) {
    let d = v.d; const lots = lotsOf(v.p.id).filter(l => !isExpired(l));
    if (d > 0) { const l = lots[lots.length - 1] || db.lots.find(x => x.pid === v.p.id); if (l) { l.qty += d; db.movements.push({id: uid(), ts: Date.now(), pid: v.p.id, lot: l.id, type: 'count', qty: d, reason: 'Stock count correction', ref: no, staff: cur.id}); } }

  }
  audit('stock.count', `${no}: ${rows.length} counted, ${vars.length} variances, ${GHS(value)}`); save(); closeModal(); render();
  toast(vars.length ? `${vars.length} variance${vars.length > 1 ? 's' : ''} posted (${GHS(value)}).` : 'Count matches the system.');
}

  const n = {brand: v('brand'), name: v('name'), cat: v('cat'), size: v('size') || '—', packCount: parseInt(v('packCount')) || 0, cartonPacks: Math.max(1, parseInt(v('cartonPacks')) || 1), cost: toP(v('cost')), retail: toP(v('retail')), tierA: toP(v('tierA')), tierAMin: Math.max(1, parseInt(v('tierAMin')) || 1), cartonPrice: toP(v('cartonPrice')), low: parseInt(v('low')) || 0, expT: v('expT') === '1', active: v('active') === '1'};
  if (!n.brand || !n.name) return err('Enter brand and name.'); if (!n.retail) return err('Enter the retail price.');
  if (n.cartonPacks > 1 && n.cartonPrice && n.cartonPrice > n.retail * n.cartonPacks) return err('Carton price is higher than buying the packs one by one.');
  const below = [['retail', n.retail], ['tier A', n.tierA], ['carton (per pack)', n.cartonPrice ? Math.round(n.cartonPrice / n.cartonPacks) : 0]].filter(([, x]) => x && x < n.cost);
  if (below.length && !isOwner()) { const ap = await requirePin(['owner'], `Price below cost (${below.map(b => b[0]).join(', ')}). Owner must approve a loss-making price.`); if (!ap) return err('Below-cost price not approved.'); }
  const p = id ? P(id) : null;
  const changed = p ? ['cost', 'retail', 'tierA', 'cartonPrice'].filter(k => p[k] !== n[k]) : [];
  if (changed.length && !v('why')) return err('Enter the reason for the price change.');
  if (p) { for (const k of changed) db.priceHistory.push({id: uid(), pid: p.id, field: k, old: p[k], new: n[k], ts: Date.now(), staff: cur.id, why: v('why')}); Object.assign(p, n); audit('product.edit', `${p.sku} ${changed.length ? 'prices: ' + changed.join(',') : ''}`); }
  else { const np = {id: uid(), sku: 'SKU-' + String(db.products.length + 1).padStart(3, '0'), ...n}; db.products.push(np); db.lots.push({id: uid(), pid: np.id, qty: 0, exp: null, batch: '-', recv: Date.now()}); audit('product.create', np.sku + ' ' + n.brand + ' ' + n.name); }
  save(); closeModal(); render(); toast('Product saved.');
}

function saveRecPay(cid) {
  const err = m => $('#rp-err').textContent = m; const amt = toP($('#rp-a').value); const m = $('#rp-m').value;
  if (amt <= 0) return err('Enter an amount.'); if (amt > balance(cid)) return err('That is more than the customer owes (' + GHS(balance(cid)) + ').');
  const sh = openShift(cur.id); if (m === 'cash' && !sh) return err('Open a cash shift to take cash.');
  let net = null, txn = null;
  if (m === 'momo') { net = $('#rp-n').value; txn = $('#rp-t').value.trim().toUpperCase(); if (txn.length < 6) return err('Enter the MoMo transaction ID.');
    if (db.sales.some(s => s.pays.some(p => p.method === 'momo' && p.net === net && p.txn === txn)) || db.recPayments.some(r => r.net === net && r.txn === txn)) return err('This MoMo transaction ID has already been used.'); }
  let left = amt; const alloc = [];
  for (const inv of db.invoices.filter(i => i.cid === cid && i.amount - i.paid - (i.written || 0) > 0).sort((a, b) => a.ts - b.ts)) { const t = Math.min(left, inv.amount - inv.paid - (inv.written || 0)); inv.paid += t; left -= t; alloc.push({inv: inv.no, amt: t}); if (!left) break; }
  const no = nextNo('PAY');
  db.recPayments.push({id: uid(), no, cid, ts: Date.now(), amount: amt, method: m, net, txn, status: m === 'momo' ? (can('verify_momo') ? 'verified' : 'pending') : 'received', by: m === 'momo' && can('verify_momo') ? cur.id : null, alloc, staff: cur.id, shiftId: sh ? sh.id : null});
  audit('receivable.payment', `${no} ${C(cid).name} ${GHS(amt)} ${m}`); save(); { const cu = C(cid); emit('debt.payment', {receipt: no, amount: cedi(amt), method: m, balance: cedi(balance(cid)), customer: {name: cu.name, phone: dispPhone(cu.phone), type: cu.type}}); } closeModal(); render(); toast('Payment recorded: ' + GHS(amt));
}

function drawFlyer() {
  const cv = $('#flyer'); if (!cv) return; const x = cv.getContext('2d'); const f = ui.flyer; const s = db.settings; const W = 1080;
  const ps = f.pids.map(P).filter(Boolean);
  x.fillStyle = '#0B1A2E'; x.fillRect(0, 0, W, W); x.strokeStyle = '#D4AF37'; x.lineWidth = 6; x.strokeRect(28, 28, W - 56, W - 56);
  x.textAlign = 'center'; x.fillStyle = '#D4AF37'; x.font = '800 64px Arial'; x.fillText(s.name, W / 2, 130);
  x.fillStyle = '#FFFFFF'; x.font = '400 30px Arial'; x.fillText(s.tagline, W / 2, 178);
  x.fillStyle = '#D4AF37'; x.fillRect(W / 2 - 60, 205, 120, 4);
  x.fillStyle = '#FFFFFF'; x.font = '800 66px Arial'; x.fillText(f.headline || '', W / 2, 300);
  if (!ps.length) { x.font = '400 34px Arial'; x.fillStyle = '#C9D2E0'; x.fillText('Choose products on the left', W / 2, 520); }
  else if (f.tpl === 'single') {
    const p = ps[0]; const promo = f.promo ? toP(f.promo) : 0;
    x.fillStyle = '#D4AF37'; x.font = '700 58px Arial'; x.fillText(p.brand, W / 2, 420);
    x.fillStyle = '#FFFFFF'; x.font = '600 46px Arial'; x.fillText(p.name, W / 2, 485); x.font = '400 32px Arial'; x.fillText(`${p.packCount} pieces per pack`, W / 2, 535);
    const pt = 'GH₵' + p2s(promo || p.retail); let fs = 104; x.font = `900 ${fs}px Arial`; while (x.measureText(pt).width > 760 && fs > 60) { fs -= 4; x.font = `900 ${fs}px Arial`; }
    const bw = x.measureText(pt).width + 96; x.fillStyle = '#D4AF37'; roundRect(x, W / 2 - bw / 2, 585, bw, 170, 26); x.fill();
    x.fillStyle = '#0B1A2E'; x.fillText(pt, W / 2, 670 + fs * 0.36);
    if (promo && promo < p.retail) { x.fillStyle = '#C9D2E0'; x.font = '400 36px Arial'; const t = 'was GH₵' + p2s(p.retail); x.fillText(t, W / 2, 810); const w = x.measureText(t).width; x.fillRect(W / 2 - w / 2, 798, w, 3); }
  } else {
    x.textAlign = 'left'; ps.slice(0, 8).forEach((p, i) => { const y = 380 + i * 62; x.fillStyle = '#FFFFFF'; x.font = '600 34px Arial'; x.fillText(`${p.brand} ${p.name}`.slice(0, 38), 80, y); x.textAlign = 'right'; x.fillStyle = '#D4AF37'; x.font = '800 38px Arial'; x.fillText('GH₵' + p2s(p.retail), W - 80, y); x.textAlign = 'left'; x.fillStyle = '#22385F'; x.fillRect(80, y + 18, W - 160, 2); });
    x.textAlign = 'center';

  x.fillStyle = '#0B1A2E'; x.font = '800 44px Arial'; x.fillText(`Call / WhatsApp ${s.phone1} · ${s.phone2}`, W / 2, 970);
  x.font = '600 30px Arial'; x.fillText(`${s.location} · Retail & Wholesale`, W / 2, 1020);

function roundRect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
AFTER.flyers = () => drawFlyer();
async function flyerCheck() {
  const f = ui.flyer; const ps = f.pids.map(P).filter(Boolean); const err = m => { const e = $('#f-err'); if (e) e.textContent = m; return false; };
  if (!ps.length) return err('Choose at least one product.');
  const out = ps.filter(p => avail(p.id) <= 0); if (out.length) return err('Out of stock: ' + out.map(p => p.name).join(', ') + '. Remove it from the flyer.');
  if (f.tpl === 'single' && f.promo) { const pr = toP(f.promo); if (pr < ps[0].cost && !isOwner()) { const ap = await requirePin(['owner'], `Offer price ${GHS(pr)} is below cost (${GHS(ps[0].cost)}).`); if (!ap) return err('Below-cost offer not approved.'); } }
  if (f.until && f.until < today()) return err('The "valid until" date is in the past.');
  return true;
}

// Reports
VIEWS.reports = () => {
  const tab = ui.tab.rep || 'sales'; const from = ui.tab.rf || new Date(Date.now() - 6 * DAY).toISOString().slice(0, 10), to = ui.tab.rt || today();
  const sales = db.sales.filter(s => { const d = new Date(s.ts).toISOString().slice(0, 10); return d >= from && d <= to; });
  const tabs = `<div class="tabs">${[['sales', 'Sales by day'], ['prod', 'Sales by product'], ['profit', 'Gross profit'], ['stock', 'Stock valuation']].map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" data-act="tab" data-g="rep" data-v="${k}">${l}</button>`).join('')}</div>`;
  const range = `<div class="row" style="margin-bottom:10px"><label>From <input class="i" style="width:auto" type="date" data-in="rf" value="${from}"></label><label>To <input class="i" style="width:auto" type="date" data-in="rt" value="${to}"></label><span class="sp"></span>${canSave() ? '<button class="btn sec" data-act="csv">Export CSV</button>' : ''}</div><div class="hint" style="margin-bottom:8px">Times in Africa/Accra. Net sales = sales − discounts − returns. Generated ${fmtDT(Date.now())}.</div>`;
  let rows = [];
  if (tab === 'sales') { const m = {}; sales.forEach(s => { const d = new Date(s.ts).toISOString().slice(0, 10); m[d] = m[d] || {n: 0, net: 0, cash: 0, momo: 0, credit: 0}; const o = m[d]; o.n++; o.net += s.total - sum(s.returns, r => r.amount); s.pays.forEach(p => o[p.method] += p.amount); });
    rows = [['Date', 'Receipts', 'Net sales', 'Cash', 'MoMo', 'Credit'], ...Object.keys(m).sort().map(d => [fmtD(d), m[d].n, m[d].net, m[d].cash, m[d].momo, m[d].credit])]; }
  if (tab === 'prod') { const m = {}; sales.forEach(s => s.lines.forEach(l => { m[l.pid] = m[l.pid] || {packs: 0, rev: 0}; m[l.pid].packs += l.packs; m[l.pid].rev += l.unitPrice * l.qty; }));
    rows = [['Product', 'Packs sold', 'Sales (before discount)'], ...Object.entries(m).sort((a, b) => b[1].rev - a[1].rev).map(([pid, v]) => [P(pid).brand + ' ' + P(pid).name, v.packs, v.rev])]; }
  if (tab === 'profit') { const net = sum(sales, s => s.total - sum(s.returns, r => r.amount)); const cogs = sum(sales, s => sum(s.lines, l => Math.round(l.cost * (l.qty - l.returned) / l.qty)));
    rows = [['Measure', 'Amount'], ['Net sales', net], ['Cost of goods sold (WAC)', cogs], ['Gross profit', net - cogs], ['Gross margin %', net ? ((net - cogs) / net * 100).toFixed(1) + '%' : '—']]; }
  if (tab === 'stock') rows = [['SKU', 'Product', 'Available packs', 'Cost per pack', 'Value'], ...db.products.map(p => [p.sku, p.brand + ' ' + p.name, avail(p.id), p.cost, avail(p.id) * p.cost])];
  ui.lastReport = {name: tab, rows};
  const money = (v, i) => typeof v === 'number' && rows[0][i] && /sales|Cash|MoMo|Credit|Amount|Cost|Value/i.test(rows[0][i]) && !/Receipts|packs/i.test(rows[0][i]);
  return `<div class="card">${tabs}${tab !== 'stock' ? range : (canSave() ? '<div class="row" style="margin-bottom:10px"><span class="sp"></span><button class="btn sec" data-act="csv">Export CSV</button></div>' : '')}<div class="tw"><table><thead><tr>${rows[0].map((h, i) => `<th class="${i ? 'num' : ''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map((v, i) => `<td class="${i ? 'num' : ''}">${money(v, i) ? GHS(v) : esc(v)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${rows[0].length}" class="empty">No data for this range.</td></tr>`}</tbody></table></div>${tab === 'profit' ? '<p class="hint">Gross profit only — expenses arrive in Release 2 for net profit.</p>' : ''}</div>`;
};

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'ovclose') { if (e.target === el) closeModal(); return; }
  const ACT = {
    go: () => { e.preventDefault(); if (d.r === 'dashboard' && ui.route !== 'dashboard') ui.statsShown = false; ui.route = d.r; closeModal(); render(); window.scrollTo(0, 0); },
    logout: () => { audit('logout', cur.name); cur = null; loginSel = null; render(); },
    pick: () => { loginSel = d.id; pinBuf = ''; renderLogin(); },
    pin: () => pinKey(d.k),
    close: closeModal,
    cat: () => { ui.cat = d.c; render(); },
    add: () => { const l = ui.cart.lines.find(x => x.pid === d.id && x.unit === 'pack'); if (l) l.qty++; else ui.cart.lines.push({pid: d.id, unit: 'pack', qty: 1}); render(); },
    qu: () => { ui.cart.lines[d.i].qty++; render(); },
    qd: () => { const l = ui.cart.lines[d.i]; l.qty--; if (l.qty <= 0) ui.cart.lines.splice(d.i, 1); render(); },
    rm: () => { ui.cart.lines.splice(d.i, 1); render(); },
    unit: () => { ui.cart.lines[d.i].unit = d.u; render(); },
    dt: () => { ui.cart.disc.type = d.t; render(); },
    clearcart: () => { ui.cart = {lines: [], cid: null, disc: {type: 'pct', v: 0}}; render(); },
    checkout: checkoutModal,
    fill: () => { const k = cartPriced(); ['cash', 'momo', 'credit'].forEach(m => { const i = $('#t-' + m); if (i) i.value = m === d.m ? p2s(k.total) : ''; }); tenderUpdate(); },
    qc: () => { const i = $('#t-cash'); i.value = p2s(toP(i.value) + parseInt(d.v) * 100); tenderUpdate(); },
    pay: completeSale,

  const list = [...document.querySelectorAll('.cylcard')].filter(b => b.offsetParent), i = list.indexOf(c), cols = list.filter(b => Math.abs(b.getBoundingClientRect().top - list[0].getBoundingClientRect().top) < 4).length || 1;
  const j = {ArrowRight: i + 1, ArrowLeft: i - 1, ArrowDown: i + cols, ArrowUp: i - cols, Home: 0, End: list.length - 1}[e.key];
  if (list[j]) { e.preventDefault(); list[j].focus(); } });

const DEFAULT_LOGO = `<svg viewBox="0 0 64 70" aria-hidden="true" focusable="false"><path d="M32 2 60 11v22c0 17-12 29-28 35C16 62 4 50 4 33V11z" fill="#0B1A2E" stroke="#D4AF37" stroke-width="4"/><path d="M32 9 53 16v17c0 13-9 22-21 27C20 55 11 46 11 33V16z" fill="#16294A"/><path d="M18 27h28c0 9-6 16-14 16s-14-7-14-16z" fill="#fff"/><path d="M18 27h28v4H18z" fill="#D4AF37"/><circle cx="26" cy="35" r="1.6" fill="#16294A"/><circle cx="38" cy="35" r="1.6" fill="#16294A"/><path d="M32 18c-2.6-3.4-8-1.6-7 2.6.7 2.8 7 6.4 7 6.4s6.3-3.6 7-6.4c1-4.2-4.4-6-7-2.6z" fill="#D4AF37"/><rect x="14" y="47" width="36" height="9" rx="2" fill="#D4AF37"/><text x="32" y="54" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-size="7" font-weight="900" fill="#0B1A2E">EBC</text></svg>`;
const productName = () => db.settings.product || 'Diapers & Wipes 360';
// The owner's uploaded logo (stored as a small PNG inside the app's data) or the built-in shield.
// Some viewers (such as a chat preview panel) block pictures written into the page as data: addresses but allow blob: ones,
// so the stored logo is turned into a blob: address once and reused. The stored copy in the data stays a plain data: PNG.
let LOGO_URL = {data: null, url: null};
function logoSrc() { const l = db.settings.logo; if (!l) return '';
  if (LOGO_URL.data !== l) { try { const [head, b64] = l.split(','), bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      if (LOGO_URL.url) URL.revokeObjectURL(LOGO_URL.url); LOGO_URL = {data: l, url: URL.createObjectURL(new Blob([u], {type: (head.match(/data:([^;]+)/) || [])[1] || 'image/png'}))}; }
    catch (e) { LOGO_URL = {data: l, url: l}; } }
  return LOGO_URL.url; }
function logoHTML(cls) { const l = logoSrc(); return l ? `<img ${cls ? `class="${cls}"` : ''} src="${l}" alt="">` : (cls ? DEFAULT_LOGO.replace('<svg ', `<svg class="${cls}" `) : DEFAULT_LOGO); }
const THEME_DEFAULT = {bb: '#0B1A2E', gold: '#D4AF37'};
function hexMix(a, b, t) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function lum(h) { return [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).map(c => c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4).reduce((a, c, i) => a + c * [.2126, .7152, .0722][i], 0); }
function contrast(a, b) { const x = lum(a), y = lum(b); return (Math.max(x, y) + .05) / (Math.min(x, y) + .05); }
// Theme colours from Settings → Branding; shades are worked out from the two chosen colours.
function applyTheme() { const t = db.settings.theme || {}, r = document.documentElement.style, bb = t.bb || THEME_DEFAULT.bb, gold = t.gold || THEME_DEFAULT.gold;
  r.setProperty('--bb', bb); r.setProperty('--bb2', hexMix(bb, '#ffffff', .08)); r.setProperty('--bb3', hexMix(bb, '#ffffff', .16)); r.setProperty('--gold', gold); r.setProperty('--gold-t', hexMix(gold, '#000000', .38));
  document.title = productName() + ' — ' + db.settings.name;
  let fav = document.querySelector('link[rel=icon]'); if (db.settings.logo) { if (!fav) { fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); } fav.href = logoSrc(); } else if (fav) fav.remove(); }
function themeProblems(bb, gold) { const out = [];
  if (contrast(bb, '#ffffff') < 7) out.push(`white text on the main colour is too faint (${contrast(bb, '#ffffff').toFixed(1)}:1, needs 7:1) — pick a darker main colour`);
  if (contrast(gold, bb) < 4.5) out.push(`the accent and main colours are too alike (${contrast(gold, bb).toFixed(1)}:1, needs 4.5:1) — pick a brighter accent`);
  return out; }
// Shrink an uploaded picture to at most 256 px and re-draw it as a PNG, so it is small, and any script inside an SVG cannot run.
async function readLogo(file) {
  if (file.type ? !/^image\//.test(file.type) : !/\.(png|jpe?g|jfif|webp|gif|svg|bmp|avif|ico)$/i.test(file.name)) throw new Error('that file is not a picture — choose a PNG, JPG, WebP, GIF or SVG');
  if (/heic|heif/i.test(file.type + file.name)) throw new Error('iPhone HEIC photos cannot be opened here — save it as JPG or PNG first');
  if (file.size > 5 * 1024 * 1024) throw new Error('the picture is larger than 5 MB');
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('this browser could not open that picture — try saving it as PNG or JPG')); i.src = url; });
    const w = img.naturalWidth || 256, h = img.naturalHeight || 256, k = Math.min(1, 256 / Math.max(w, h)), c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

  } finally { URL.revokeObjectURL(url); } }

  return (can('sell') && !openShift(cur.id) ? 1 : 0) + (pendingMomo() ? 1 : 0) + (db.lots.some(l => l.qty > 0 && isExpired(l)) ? 1 : 0) + (db.lots.some(l => l.qty > 0 && nearExp(l)) ? 1 : 0) + (ws.some(c => balance(c.id) > 0 && overdueDays(c.id) > 0) ? 1 : 0); }

setInterval(() => { const c = document.getElementById('clk'); if (c) c.textContent = clockText(); }, 1000);
